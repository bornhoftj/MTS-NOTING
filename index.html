<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTS NOTING PRO v1.3.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'mts-red': '#8C1D1D',
              'mts-red-light': '#B91C1C',
              'mts-red-dark': '#7F1D1D',
              'aether-bg': '#F5F5F5',
              'aether-bg-dark': '#000000',
              'aether-surface': 'rgba(255, 255, 255, 0.8)',
              'aether-surface-dark': 'rgba(25, 25, 25, 0.75)',
              'aether-border': 'rgba(140, 29, 29, 0.2)',
              'aether-border-dark': 'rgba(255, 255, 255, 0.15)',
              'accent-primary': '#8C1D1D',
              'accent-glow': 'rgba(140, 29, 29, 0.5)',
              'text-main': '#171717',
              'text-main-dark': '#F5F5F5',
              'text-muted': '#737373',
              'text-muted-dark': '#A3A3A3',
            },
            animation: {
              'mesh-gradient': 'mesh 15s ease infinite',
              'fade-in-stagger': 'fadeIn 0.5s ease-out forwards',
              'pulse-glow': 'pulseGlow 2.5s infinite ease-in-out',
            },
            keyframes: {
              mesh: {
                '0%': { backgroundPosition: '0% 50%' },
                '50%': { backgroundPosition: '100% 50%' },
                '100%': { backgroundPosition: '0% 50%' },
              },
              fadeIn: {
                '0%': { opacity: 0, transform: 'translateY(10px)' },
                '100%': { opacity: 1, transform: 'translateY(0)' },
              },
              pulseGlow: {
                '0%, 100%': { boxShadow: '0 0 20px var(--tw-shadow-color), 0 0 30px var(--tw-shadow-color)' },
                '50%': { boxShadow: '0 0 30px var(--tw-shadow-color), 0 0 45px var(--tw-shadow-color)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .glass-surface {
        background-color: var(--surface-bg, rgba(255, 255, 255, 0.7));
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
        border: 1px solid rgba(0, 0, 0, 0.05);
      }
      .dark .glass-surface {
        background-color: var(--surface-bg-dark, rgba(25, 25, 25, 0.75));
        border: 1px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 1), 0 0 0 1px rgba(255, 255, 255, 0.05);
      }
      .holographic-border {
        box-shadow: 0 0 0 1px theme('colors.aether-border');
      }
      .dark .holographic-border {
        box-shadow: 0 0 0 1px theme('colors.aether-border-dark');
      }
      .button-etched {
        background: transparent;
        color: theme('colors.text-muted');
        border: 1px solid theme('colors.gray.200');
        transition: all 0.3s ease;
      }
      .dark .button-etched {
        color: theme('colors.text-muted-dark');
        border-color: theme('colors.gray.700');
      }
      .button-etched:hover:not(:disabled) {
        background: theme('colors.accent-primary');
        border-color: theme('colors.accent-primary');
        color: white;
        box-shadow: 0 0 20px theme('colors.accent-glow');
      }
      .dynamic-bg {
        background: linear-gradient(45deg, #f5f5f5, #e5e5e5, #d4d4d4, #f5f5f5);
        background-size: 400% 400%;
        animation: mesh 15s ease infinite;
      }
      .dark .dynamic-bg {
        background: linear-gradient(45deg, #000000, #0a0a0a, #111111, #000000);
        background-size: 400% 400%;
        animation: mesh 15s ease infinite;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.1.0",
    "react-dom/client": "https://esm.sh/react-dom@^19.1.0/client",
    "react/": "https://esm.sh/react@^19.1.0/",
    "@google/genai": "https://esm.sh/@google/genai@^1.4.0",
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "mammoth": "https://esm.sh/mammoth@1.8.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-aether-bg dark:bg-aether-bg-dark text-text-main dark:text-text-main-dark dynamic-bg">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
